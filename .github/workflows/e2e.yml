name: E2E Tests

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - run: npm ci
      - run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - run: python -m ruff check backend
      - run: npm run test --workspace=apps/dm
      # Los tests importan `main` y `wall_detection`, que viven en backend/, no
      # en backend/tests/. `python -m pytest` mete el cwd en sys.path, asi que
      # hay que correrlo desde ahi o los imports no resuelven.
      - run: python -m pytest
        working-directory: backend

  test:
    needs: [checks, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: pip install -r backend/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
